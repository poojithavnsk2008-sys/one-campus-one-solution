name: one_campus_one_solution
description: A comprehensive Flutter app for students and teachers - All-in-one solution for campus management, communication, and academic resources.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0
  http: ^1.1.0
  intl: ^0.19.0
  image_picker: ^1.0.0
  permission_handler: ^11.4.0
  shared_preferences: ^2.2.0
  cached_network_image: ^3.3.0
  flutter_local_notifications: ^16.1.0
  dio: ^5.3.0
  get_it: ^7.6.0
  equatable: ^2.0.5
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_linter: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
